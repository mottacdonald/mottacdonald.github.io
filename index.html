<html>
    <head>
        <title>parbio</title>

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
        />

        <style type="text/css">
            @import url(https://db.onlinewebfonts.com/c/3c9a33e9913448d684afff5b4b0cc59c?family=SCE-PS3+Rodin+LATIN+Regular);
            html,
            body {
                overflow: hidden;
            }

            p,
            b,
            i,
            span,
            li,
            h1,
            h2,
            h3,
            h4 {
                font-family: "SCE-PS3 Rodin LATIN Regular";
                font-size: 28px;
            }

            body {
                color: white;
                #background-image: linear-gradient(
                    90deg,
                    #0a6d00 0%,
                    #33a128 45%,
                    #0a6d00 100%
                ); /* green */
                #background-image: linear-gradient(
                    90deg,
                    #002ea2 0%,
                    #0042e7 45%,
                    #002ea2 100%
                ); /* blue */
                background-image: linear-gradient(
                    90deg,
                    #9e8003 0%,
                    #cfa807 45%,
                    #9e8003 100%
                ); /* orange */
            }

            .headertext {
                padding-top: 3px;
                color: white;
                margin: 3px;
                font-size: 35px;
                font-weight: bold;
            }

            .line_top {
                width: 90%;
                border: 0;
                margin: 0px;
                height: 1px;
                background-image: linear-gradient(
                    to right,
                    rgba(0, 0, 0, 0),
                    rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0)
                );
            }
            .line_bot {
                width: 100%;
                border: 0;
                margin: 0px;
                height: 2px;
                background-image: linear-gradient(
                    to right,
                    rgba(200, 200, 200, 0),
                    rgba(200, 200, 200, 0.3),
                    rgba(200, 200, 200, 0)
                );
            }

            .button {
                background-color: rgba(255, 255, 255, 0.2);
                border: 0;
                border-radius: 15px;
                color: #fff;
                cursor: pointer;
                display: inline-block;
                font-family: "SCE-PS3 Rodin LATIN Regular";
                font-size: 30px;
                font-weight: 800;
                text-shadow: 2px 2px 8px #444444;
                outline: 0;
                padding: 5px 40px;
                position: relative;
                text-align: center;
                text-decoration: none;
                transition: all 0.3s;
                user-select: none;
                -webkit-user-select: none;
                touch-action: manipulation;
                box-shadow:
                    rgba(255, 255, 255, 0.2) 0 3px 15px inset,
                    rgba(0, 0, 0, 0.2) 0 3px 5px,
                    rgba(0, 0, 0, 0.2) 0 10px 13px;
            }

            .button:before {
                background-color: initial;
                background-image: linear-gradient(
                    #fff 0,
                    rgba(255, 255, 255, 0) 100%
                );
                border-radius: 20px;
                border-bottom-left-radius: 20px;
                border-bottom-right-radius: 20px;
                content: "";
                height: 50%;
                left: 0%;
                opacity: 0.6;
                position: absolute;
                top: 0;
                transition: all 0.3s;
                width: 100%;
            }

            .button:hover {
                background-color: rgba(255, 255, 255, 0.4);
                #transform: scale(1.05);
            }

            .contentcontainer {
                border: 0px;
                border-color: blue;
                border-style: solid;

                font-size: 28px;
                width: 90%;
                #padding-top: 40px;
            }

            .buttonarea {
                border: 0px;
                border-color: red;
                border-style: solid;

                position: fixed;

                width: 89%;
                left: 6%;

                bottom: 15px;
            }

            .scrollbox {
                font-size: 25px;
                text-align: left;
                padding-left: 5px;
                padding-right: 10px;

                width: calc(100% - 20px);
                height: calc(100% - 140px);
                overflow-y: scroll;
            }

            @-webkit-keyframes load5 {
                0%,
                100% {
                    box-shadow:
                        0em -2.6em 0em 0em #ffffff,
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0),
                        2.5em 0em 0 0em rgba(255, 255, 255, 0),
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0.1),
                        0em 2.5em 0 0em rgba(255, 255, 255, 0.2),
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.2),
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0.5),
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.7);
                }
                12.5% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0.7),
                        1.8em -1.8em 0 0em #ffffff,
                        2.5em 0em 0 0em rgba(255, 255, 255, 0),
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0),
                        0em 2.5em 0 0em rgba(255, 255, 255, 0.1),
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.2),
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0.2),
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.5);
                }
                25% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0.5),
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0.7),
                        2.5em 0em 0 0em #ffffff,
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0),
                        0em 2.5em 0 0em rgba(255, 255, 255, 0),
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.1),
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0.2),
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2);
                }
                37.5% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0.2),
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0.5),
                        2.5em 0em 0 0em rgba(255, 255, 255, 0.7),
                        1.75em 1.75em 0 0em #ffffff,
                        0em 2.5em 0 0em rgba(255, 255, 255, 0),
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0),
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0.1),
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2);
                }
                50% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0.2),
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2),
                        2.5em 0em 0 0em rgba(255, 255, 255, 0.5),
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0.7),
                        0em 2.5em 0 0em #ffffff,
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0),
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0),
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.1);
                }
                62.5% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0.1),
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2),
                        2.5em 0em 0 0em rgba(255, 255, 255, 0.2),
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0.5),
                        0em 2.5em 0 0em rgba(255, 255, 255, 0.7),
                        -1.8em 1.8em 0 0em #ffffff,
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0),
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0);
                }
                75% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0),
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0.1),
                        2.5em 0em 0 0em rgba(255, 255, 255, 0.2),
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2),
                        0em 2.5em 0 0em rgba(255, 255, 255, 0.5),
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.7),
                        -2.6em 0em 0 0em #ffffff,
                        -1.8em -1.8em 0 0em rgba(255, 255, 255, 0);
                }
                87.5% {
                    box-shadow:
                        0em -2.6em 0em 0em rgba(255, 255, 255, 0),
                        1.8em -1.8em 0 0em rgba(255, 255, 255, 0),
                        2.5em 0em 0 0em rgba(255, 255, 255, 0.1),
                        1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2),
                        0em 2.5em 0 0em rgba(255, 255, 255, 0.2),
                        -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.5),
                        -2.6em 0em 0 0em rgba(255, 255, 255, 0.7),
                        -1.8em -1.8em 0 0em #ffffff;
                }
            }

            .hiddenlink {
                text-decoration: none;
                color: #ffffff;
                #font-weight: bold;
            }
        </style>

        <script>
            const pages = {
                welcome: {
                    title: "partol",
                    text: "hi bro i am the best person ever\ni make cool stuff\ni like being cool",
                    button: {
                        label: "next",
                        next: "hen",
                    },
                },

                hen: {
                    title: "ok but like fr",
                    text: "I've been a unity developer for around 2 years.\nI've BEEN skidding before you.\nI have 1.5 years of experience with C# and have been using Luau for almost 6 years.\nbrooo like if you want me to dev i'll do it but only if u give money",
                    button: {
                        label: "back",
                        next: "welcome",
                    },
                },
            };

            function showPage(id) {
                const page = pages[id];
                if (!page) return;

                document.getElementById("title").innerText = page.title;
                document.getElementById("text").innerText = page.text;

                const btn = document.getElementById("button");

                btn.innerText = page.button.label;

                if (page.button.next) {
                    btn.onclick = () => showPage(page.button.next);
                    btn.removeAttribute("href");
                } else {
                    btn.onclick = null;
                    btn.href = page.button.href;
                }
            }

            /* FIX: ensure DOM exists before rendering */
            document.addEventListener("DOMContentLoaded", () => {
                showPage("welcome");
            });
        </script>
    </head>

    <body>
        <center>
            <img
                src="watermark.png"
                width="400px"
                style="
                    position: absolute;
                    right: 0%;
                    bottom: 0%;
                    opacity: 0.06;
                    z-index: -1;
                "
            />

            <p class="headertext" id="title">partol</p>

            <hr class="line_top" />
            <hr class="line_bot" />

            <div class="contentcontainer">
                <br />
                <p id="text">
                    hi bro i am the best person ever<br />i make cool stuff<br />i
                    like being cool
                </p>
            </div>

            <div class="buttonarea">
                <a class="button" id="button">next</a>
            </div>
        </center>
    </body>
</html>
